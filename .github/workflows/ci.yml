name: HTML CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: |
          pwd
          ls -la

      - name: Verify Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "✅ All files are present."


